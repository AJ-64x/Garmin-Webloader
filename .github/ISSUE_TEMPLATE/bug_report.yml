name: Something isn't working
description: Tell us what went wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for letting us know! A few details help a lot.
  - type: input
    id: garmin
    attributes:
      label: Which Garmin do you have?
      placeholder: "For example: Instinct 2S"
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How were you loading the file?
      options:
        - The website
        - The Python script
        - The Node script
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and computer (if you used the website)
      placeholder: "For example: Chrome 131 on Windows 11, or Chrome on a Pixel 8"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log or error message (optional)
      description: On the website, open “Activity log” and press “Copy log”, then paste it here.
      render: text
