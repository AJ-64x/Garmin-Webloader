<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">Garmin Webloader</title>
  <desc id="d">Load apps onto your Garmin, right from your browser.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="90%">
      <stop offset="0" stop-color="#2a2a2d"/><stop offset="1" stop-color="#161617"/>
    </radialGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4db0ff"/><stop offset="1" stop-color="#0a64d8"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d2d2d7"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>

  <!-- app icon -->
  <rect x="596" y="38" width="88" height="88" rx="20" fill="url(#icon)"/>
  <rect x="596.5" y="38.5" width="87" height="87" rx="19.5" fill="none" stroke="#fff" stroke-opacity=".25"/>
  <g stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M640 62 V94"/><path d="M624 80 L640 96 L656 80"/>
  </g>
  <rect x="624" y="104" width="32" height="4" rx="2" fill="#fff" fill-opacity=".9"/>

  <g text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','Segoe UI',Arial,sans-serif">
    <text x="640" y="212" font-size="70" font-weight="700" fill="url(#title)" letter-spacing="-2.2">Garmin Webloader</text>
    <text x="640" y="258" font-size="26" fill="#86868b" letter-spacing="-.2">Load apps onto your Garmin, right from your browser.</text>
    <text x="640" y="304" font-size="22" fill="#2997ff">Open Webloader ›</text>
  </g>
</svg>
